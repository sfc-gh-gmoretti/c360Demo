<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Web Application -->
  <rect x="20" y="100" width="140" height="60" rx="4" fill="#e5e5e5" stroke="#999" stroke-width="1"/>
  <text x="90" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Web Application</text>
  
  <!-- Arrow 1 -->
  <line x1="160" y1="130" x2="220" y2="130" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Snowflake Container (SPCS) - Application Runtime -->
  <rect x="230" y="85" width="200" height="90" rx="4" fill="#a0a0a0" stroke="#666" stroke-width="1"/>
  <text x="330" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold">Snowflake Container (SPCS)</text>
  <text x="330" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">- Application Runtime</text>
  
  <!-- Arrow 2 - API Call -->
  <line x1="430" y1="110" x2="500" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="465" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">API Call</text>
  
  <!-- ML Inference Service -->
  <rect x="510" y="70" width="180" height="80" rx="4" fill="#a0a0a0" stroke="#666" stroke-width="1"/>
  <text x="600" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold">ML Inference Service</text>
  <text x="600" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fff">(Snowflake Container -</text>
  <text x="600" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fff">SPCS)</text>
  
  <!-- Arrow 3 - Loads Model -->
  <line x1="690" y1="100" x2="770" y2="100" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="730" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Loads Model</text>
  
  <!-- Snowflake ML Registry -->
  <rect x="780" y="70" width="180" height="60" rx="4" fill="#e5e5e5" stroke="#999" stroke-width="1"/>
  <text x="870" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Snowflake ML Registry</text>
  
  <!-- Arrow 4 - To Registered Model -->
  <line x1="960" y1="100" x2="1030" y2="100" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Registered ML Model -->
  <rect x="1040" y="70" width="140" height="60" rx="4" fill="#e5e5e5" stroke="#999" stroke-width="1"/>
  <text x="1110" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Registered ML Model</text>
  
  <!-- Arrow 5 - Exposes (down from ML Inference) -->
  <line x1="600" y1="150" x2="600" y2="190" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="640" y="175" text-anchor="start" font-family="Arial, sans-serif" font-size="11" fill="#666">Exposes</text>
  
  <!-- Inference API Endpoint -->
  <rect x="510" y="200" width="180" height="50" rx="4" fill="#e5e5e5" stroke="#999" stroke-width="1"/>
  <text x="600" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Inference API Endpoint</text>
  
  <!-- Arrow 6 - Prediction Response (back to SPCS) -->
  <path d="M 510 225 Q 400 225 380 175" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="430" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Prediction Response</text>
</svg>